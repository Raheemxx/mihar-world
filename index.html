    .bg.loaded { transform: scale(1); }

    /* Diamond shine animation on bg */
    .bg::after {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 55% at 52% 48%, rgba(255,255,255,0) 0%, rgba(255,255,255,0.18) 35%, rgba(255,255,255,0) 70%),
        linear-gradient(125deg, transparent 30%, rgba(255,255,255,0.22) 50%, transparent 70%);
      animation: diamondShine 4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes diamondShine {
      0%   { opacity: 0; background-position: -100% 0; transform: translateX(-60%) skewX(-15deg); }
      30%  { opacity: 1; }
      60%  { opacity: 1; }
      100% { opacity: 0; transform: translateX(160%) skewX(-15deg); }
    }

    /* Vignette */
    .vignette {
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 75% 80% at 50% 50%, transparent 35%, rgba(8,8,8,0.4) 70%, rgba(8,8,8,0.88) 100%),
        linear-gradient(to top, rgba(8,8,8,0.95) 0%, transparent 35%),
        linear-gradient(to bottom, rgba(8,8,8,0.5) 0%, transparent 18%);
      pointer-events: none;
    }

    /* WATCH NOW */
    .watch-btn {
      position: fixed;
      top: clamp(24px, 5vh, 48px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      animation: fadeDown 1.4s cubic-bezier(.22,1,.36,1) both;
    }
    .watch-btn a {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
      padding: 11px 26px 11px 20px;
      border: 1px solid rgba(240,236,230,0.2);
      border-radius: 40px;
      background: rgba(8,8,8,0.45);
      backdrop-filter: blur(10px);
      color: var(--white);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(13px, 2vw, 16px);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: background 0.25s, border-color 0.25s, transform 0.25s, box-shadow 0.25s;
    }
    .watch-btn a:hover {
      background: rgba(192,24,28,0.18);
      border-color: var(--red);
      box-shadow: 0 0 24px rgba(192,24,28,0.35);
      transform: scale(1.04);
    }
    .watch-btn .play-icon {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--red);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.25s;
    }
    .watch-btn a:hover .play-icon { background: #e01f24; }
    .watch-btn .play-icon svg { width: 11px; height: 11px; fill: var(--white); margin-left: 2px; }

    /* PAGE */
    .page {
      position: relative; z-index: 10;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding-bottom: 0;
    }

    .bottom {
      display: flex; flex-direction: column;
      align-items: center; gap: 20px;
      animation: fadeUp 1.2s cubic-bezier(.22,1,.36,1) both;
      width: 100%;
      background: linear-gradient(to top, rgba(8,8,8,1) 0%, rgba(8,8,8,0.92) 60%, transparent 100%);
      padding: 40px 20px clamp(32px, 6vh, 64px);
      margin-top: 60vh;
    }

    /* SOCIAL LINKS */
    .links { display: flex; gap: clamp(28px, 5vw, 52px); align-items: center; }
    .link {
      display: flex; flex-direction: column;
      align-items: center; gap: 7px;
      text-decoration: none;
      color: var(--grey);
      transition: color 0.25s, transform 0.25s;
    }
    .link:hover { color: var(--white); transform: translateY(-4px); }
    .link:hover .icon-ring { border-color: var(--red); box-shadow: 0 0 18px rgba(192,24,28,0.45); }
    .link:hover svg { fill: var(--white); }
    .icon-ring {
      width: 54px; height: 54px;
      border-radius: 50%;
      border: 1.5px solid rgba(176,168,160,0.35);
      display: flex; align-items: center; justify-content: center;
      background: rgba(8,8,8,0.55);
      backdrop-filter: blur(6px);
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .link svg { width: 22px; height: 22px; fill: var(--grey); transition: fill 0.25s; }
    .link-label { font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; opacity: 0.7; }

    .advisory { font-size: 9px; letter-spacing: 0.18em; color: rgba(176,168,160,0.35); text-transform: uppercase; margin-top: 4px; }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 480px) {
      .icon-ring { width: 46px; height: 46px; }
      .link svg  { width: 19px; height: 19px; }
      .links     { gap: 22px; }
    }
  </style>
</head>

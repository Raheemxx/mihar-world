  .bg-grain{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    opacity:.16;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation:grain 8s steps(6) infinite;
  }
  @keyframes grain{
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(-2%,-3%)}
    40%{transform:translate(-3%,2%)}
    60%{transform:translate(2%,3%)}
    80%{transform:translate(3%,-2%)}
  }

  .bg-vignette{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(0,0,0,0) 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.78) 100%),
      linear-gradient(180deg, rgba(6,5,4,.72) 0%, rgba(6,5,4,.15) 20%, rgba(6,5,4,.1) 45%, rgba(6,5,4,.55) 68%, rgba(6,5,4,.97) 100%);
  }

  /* ---------- LAYOUT ---------- */
  .page{
    position:relative;
    z-index:3;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:clamp(20px,4vw,48px);
  }

  /* ---------- TOP BAR / EP LINK ---------- */
  .topbar{
    display:flex;
    justify-content:center;
    animation:fadeDown 1s ease-out both;
  }
  @keyframes fadeDown{
    from{opacity:0;transform:translateY(-14px)}
    to{opacity:1;transform:translateY(0)}
  }

  .ep-link{
    display:inline-flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:var(--bone);
    border:1px solid rgba(236,229,216,.28);
    background:rgba(10,9,8,.42);
    backdrop-filter:blur(6px);
    padding:9px 18px 9px 14px;
    border-radius:999px;
    font-family:'Oswald',sans-serif;
    font-weight:500;
    letter-spacing:.06em;
    font-size:12.5px;
    transition:border-color .25s ease, background .25s ease, transform .25s ease;
  }
  .ep-link:hover{
    border-color:var(--blood-glow);
    background:rgba(30,10,10,.55);
    transform:translateY(-1px);
  }
  .ep-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--blood-glow);
    box-shadow:0 0 8px 2px rgba(255,59,59,.75);
    flex-shrink:0;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.45;transform:scale(.72)}
  }
  .ep-label-eyebrow{
    color:var(--amber);
    font-size:10px;
    letter-spacing:.18em;
    margin-right:2px;
    font-weight:600;
  }
  .ep-title{
    font-weight:700;
    letter-spacing:.08em;
  }
  .ep-arrow{
    color:var(--bone-dim);
    font-size:13px;
    transition:transform .25s ease;
  }
  .ep-link:hover .ep-arrow{ transform:translateX(3px); color:var(--blood-glow); }

  /* ---------- HERO WORDMARK ---------- */
  .hero{
    text-align:center;
    padding-bottom:6px;
  }

  .wordmark{
    font-family:'Anton',sans-serif;
    font-size:clamp(64px,18vw,168px);
    line-height:.86;
    letter-spacing:.01em;
    color:var(--bone);
    text-shadow:
      0 2px 0 rgba(0,0,0,.5),
      0 12px 40px rgba(0,0,0,.65);
    animation:riseIn 1.1s cubic-bezier(.16,.9,.28,1) both;
    animation-delay:.15s;
  }
  @keyframes riseIn{
    from{opacity:0; transform:translateY(26px); letter-spacing:.15em;}
    to{opacity:1; transform:translateY(0); letter-spacing:.01em;}
  }

  .tagline{
    margin-top:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:.42em;
    font-size:clamp(12px,2.2vw,16px);
    color:var(--blood-glow);
    text-transform:uppercase;
    animation:fadeUp 1s ease-out both;
    animation-delay:.5s;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .tagline .rule{
    width:34px;height:1px;
    background:linear-gradient(90deg, transparent, var(--blood-glow));
  }
  .tagline .rule.right{ background:linear-gradient(90deg, var(--blood-glow), transparent); }

  /* ---------- PLATFORM LINKS ---------- */
  .platforms{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    margin-top:clamp(28px,5vw,44px);
    animation:fadeUp 1s ease-out both;
    animation-delay:.75s;
  }

  .platform{
    position:relative;
    display:flex;
    align-items:center;
    gap:11px;
    text-decoration:none;
    color:var(--bone);
    padding:13px 22px 13px 16px;
    min-width:168px;
    border-radius:10px;
    border:1px solid rgba(236,229,216,.16);
    background:linear-gradient(180deg, rgba(22,19,17,.55), rgba(10,9,8,.68));
    backdrop-filter:blur(5px);
    overflow:hidden;
    transition:border-color .3s ease, transform .3s ease, background .3s ease;
  }

  .platform::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 20% 0%, rgba(201,34,42,.25), transparent 60%);
    opacity:0;
    transition:opacity .3s ease;
  }

  .platform:hover{
    transform:translateY(-3px);
    border-color:rgba(255,59,59,.55);
    background:linear-gradient(180deg, rgba(30,14,13,.7), rgba(10,9,8,.78));
  }
  .platform:hover::before{ opacity:1; }

  .platform .icon{
    width:20px;height:20px;flex-shrink:0;
    color:var(--bone);
    position:relative;
    z-index:1;
  }

  .platform .p-text{
    display:flex;
    flex-direction:column;
    position:relative;
    z-index:1;
    line-height:1.15;
  }
  .platform .p-name{
    font-weight:700;
    font-size:13.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .platform .p-handle{
    font-size:10.5px;
    color:var(--bone-dim);
    letter-spacing:.02em;
    margin-top:2px;
    font-weight:400;
  }

  /* ---------- FOOTER ---------- */
  .footer{
    text-align:center;
    margin-top:clamp(28px,5vw,40px);
    color:rgba(168,159,143,.65);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    animation:fadeUp 1s ease-out both;
    animation-delay:.95s;
  }
  .footer span{ color:var(--amber-dim); }

  @media (max-width:420px){
    .platform{ min-width:0; width:100%; max-width:280px; }
    .platforms{ flex-direction:column; align-items:center; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001s !important; animation-iteration-count:1 !important; }
    .bg-grain{ animation:none; }
  }
</style>

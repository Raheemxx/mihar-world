<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIHAR — Rapper, Agadir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-black:#0a0908;
    --char:#161311;
    --amber:#c99a5a;
    --amber-dim:#8a6a3d;
    --blood:#c9222a;
    --blood-glow:#ff3b3b;
    --bone:#ece5d8;
    --bone-dim:#a89f8f;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html{scroll-behavior:smooth;}

  body{
    min-height:100vh;
    background-color:var(--ink-black);
    color:var(--bone);
    font-family:'Oswald',sans-serif;
    position:relative;
    overflow-x:hidden;
  }

  /* ---------- BACKGROUND ---------- */
  .bg-wrap{
    position:fixed;
    inset:0;
    z-index:0;
    background-image:url('mihar-bg.png');
    background-size:cover;
    background-position:center 20%;
    filter:saturate(1.05) contrast(1.05);
  }

  .bg-grain{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    opacity:.16;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation:grain 8s steps(6) infinite;
  }
  @keyframes grain{
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(-2%,-3%)}
    40%{transform:translate(-3%,2%)}
    60%{transform:translate(2%,3%)}
    80%{transform:translate(3%,-2%)}
  }

  .bg-vignette{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(0,0,0,0) 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.78) 100%),
      linear-gradient(180deg, rgba(6,5,4,.72) 0%, rgba(6,5,4,.15) 20%, rgba(6,5,4,.1) 45%, rgba(6,5,4,.55) 68%, rgba(6,5,4,.97) 100%);
  }

  /* ---------- LAYOUT ---------- */
  .page{
    position:relative;
    z-index:3;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:clamp(20px,4vw,48px);
  }

  /* ---------- TOP BAR / EP LINK ---------- */
  .topbar{
    display:flex;
    justify-content:center;
    animation:fadeDown 1s ease-out both;
  }
  @keyframes fadeDown{
    from{opacity:0;transform:translateY(-14px)}
    to{opacity:1;transform:translateY(0)}
  }

  .ep-link{
    display:inline-flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:var(--bone);
    border:1px solid rgba(236,229,216,.28);
    background:rgba(10,9,8,.42);
    backdrop-filter:blur(6px);
    padding:9px 18px 9px 14px;
    border-radius:999px;
    font-family:'Oswald',sans-serif;
    font-weight:500;
    letter-spacing:.06em;
    font-size:12.5px;
    transition:border-color .25s ease, background .25s ease, transform .25s ease;
  }
  .ep-link:hover{
    border-color:var(--blood-glow);
    background:rgba(30,10,10,.55);
    transform:translateY(-1px);
  }
  .ep-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--blood-glow);
    box-shadow:0 0 8px 2px rgba(255,59,59,.75);
    flex-shrink:0;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.45;transform:scale(.72)}
  }
  .ep-label-eyebrow{
    color:var(--amber);
    font-size:10px;
    letter-spacing:.18em;
    margin-right:2px;
    font-weight:600;
  }
  .ep-title{
    font-weight:700;
    letter-spacing:.08em;
  }
  .ep-arrow{
    color:var(--bone-dim);
    font-size:13px;
    transition:transform .25s ease;
  }
  .ep-link:hover .ep-arrow{ transform:translateX(3px); color:var(--blood-glow); }

  /* ---------- HERO WORDMARK ---------- */
  .hero{
    text-align:center;
    padding-bottom:6px;
  }

  .name-link{
    display:inline-block;
    text-decoration:none;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    position:relative;
  }

  .wordmark{
    font-family:'Anton',sans-serif;
    font-size:clamp(64px,18vw,168px);
    line-height:.86;
    letter-spacing:.01em;
    color:var(--bone);
    text-shadow:
      0 2px 0 rgba(0,0,0,.5),
      0 12px 40px rgba(0,0,0,.65);
    animation:riseIn 1.1s cubic-bezier(.16,.9,.28,1) both, flicker 7s infinite;
    animation-delay:.15s, 0s;
    transition:transform .25s ease, text-shadow .25s ease;
  }
  @keyframes riseIn{
    from{opacity:0; transform:translateY(26px); letter-spacing:.15em;}
    to{opacity:1; transform:translateY(0); letter-spacing:.01em;}
  }

  /* idle streetlight-style flicker so the mark reads as "alive" */
  @keyframes flicker{
    0%, 92%, 100% { opacity:1; }
    93% { opacity:.75; }
    94% { opacity:1; }
    95.5% { opacity:.6; }
    96% { opacity:1; }
  }

  .name-link:hover .wordmark,
  .name-link:focus-visible .wordmark{
    transform:translateY(-2px);
    text-shadow:
      2px 0 0 rgba(201,34,42,.65),
      -2px 0 0 rgba(201,154,90,.4),
      0 12px 40px rgba(0,0,0,.65);
    animation:riseIn 1.1s cubic-bezier(.16,.9,.28,1) both, flicker 7s infinite, glitch 1.8s infinite;
    animation-delay:.15s, 0s, 0s;
  }

  @keyframes glitch{
    0%, 100% { clip-path: inset(0 0 0 0); transform:translate(0,0); }
    2% { clip-path: inset(10% 0 70% 0); transform:translate(-3px,0); }
    4% { clip-path: inset(60% 0 5% 0); transform:translate(3px,0); }
    6% { clip-path: inset(0 0 0 0); transform:translate(0,0); }
    46%{ clip-path: inset(0 0 0 0); transform:translate(0,0); }
    48%{ clip-path: inset(30% 0 40% 0); transform:translate(2px,0); }
    50%{ clip-path: inset(0 0 0 0); transform:translate(0,0); }
  }

  .name-link:active .wordmark{
    transform:scale(0.97) translateY(0);
    transition-duration:.08s;
  }

  .enter-hint{
    display:block;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:11px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--bone-dim);
    margin-top:2px;
    opacity:0;
    transform:translateY(-4px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .enter-hint::before{ content:'— '; color:var(--blood-glow); }
  .name-link:hover .enter-hint,
  .name-link:focus-visible .enter-hint{
    opacity:1;
    transform:translateY(0);
  }

  /* click flash — placeholder feedback until the next page exists */
  .flash{
    position:fixed; inset:0; z-index:100;
    background:var(--bone);
    opacity:0;
    pointer-events:none;
  }
  .flash.hit{ animation: flashpop .5s ease-out; }
  @keyframes flashpop{
    0%{ opacity:0; }
    12%{ opacity:.85; }
    100%{ opacity:0; }
  }

  .tagline{
    margin-top:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:.42em;
    font-size:clamp(12px,2.2vw,16px);
    color:var(--blood-glow);
    text-transform:uppercase;
    animation:fadeUp 1s ease-out both;
    animation-delay:.5s;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .tagline .rule{
    width:34px;height:1px;
    background:linear-gradient(90deg, transparent, var(--blood-glow));
  }
  .tagline .rule.right{ background:linear-gradient(90deg, var(--blood-glow), transparent); }

  /* ---------- PLATFORM LINKS ---------- */
  .platforms{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    margin-top:clamp(28px,5vw,44px);
    animation:fadeUp 1s ease-out both;
    animation-delay:.75s;
  }

  .platform{
    position:relative;
    display:flex;
    align-items:center;
    gap:11px;
    text-decoration:none;
    color:var(--bone);
    padding:13px 22px 13px 16px;
    min-width:168px;
    border-radius:10px;
    border:1px solid rgba(236,229,216,.16);
    background:linear-gradient(180deg, rgba(22,19,17,.55), rgba(10,9,8,.68));
    backdrop-filter:blur(5px);
    overflow:hidden;
    transition:border-color .3s ease, transform .3s ease, background .3s ease;
  }

  .platform::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 20% 0%, rgba(201,34,42,.25), transparent 60%);
    opacity:0;
    transition:opacity .3s ease;
  }

  .platform:hover{
    transform:translateY(-3px);
    border-color:rgba(255,59,59,.55);
    background:linear-gradient(180deg, rgba(30,14,13,.7), rgba(10,9,8,.78));
  }
  .platform:hover::before{ opacity:1; }

  .platform .icon{
    width:20px;height:20px;flex-shrink:0;
    color:var(--bone);
    position:relative;
    z-index:1;
  }

  .platform .p-text{
    display:flex;
    flex-direction:column;
    position:relative;
    z-index:1;
    line-height:1.15;
  }
  .platform .p-name{
    font-weight:700;
    font-size:13.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .platform .p-handle{
    font-size:10.5px;
    color:var(--bone-dim);
    letter-spacing:.02em;
    margin-top:2px;
    font-weight:400;
  }

  /* ---------- FOOTER ---------- */
  .footer{
    text-align:center;
    margin-top:clamp(28px,5vw,40px);
    color:rgba(168,159,143,.65);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    animation:fadeUp 1s ease-out both;
    animation-delay:.95s;
  }
  .footer span{ color:var(--amber-dim); }

  @media (max-width:420px){
    .platform{ min-width:0; width:100%; max-width:280px; }
    .platforms{ flex-direction:column; align-items:center; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001s !important; animation-iteration-count:1 !important; }
    .bg-grain{ animation:none; }
  }
</style>
</head>
<body>

<div class="bg-wrap"></div>
<div class="bg-grain"></div>
<div class="bg-vignette"></div>
<div class="flash" id="flash"></div>

<div class="page">

  <div></div>

  <div></div>

  <div>
    <div class="hero">
      <a href="#" class="name-link" id="enterLink" aria-label="Enter MIHAR site (coming soon)">
        <div class="wordmark">MIHAR</div>
        <span class="enter-hint">Enter — coming soon</span>
      </a>
      <div class="tagline"><span class="rule"></span>RAPPER<span>&middot;</span>AGADIR<span class="rule right"></span></div>
    </div>

    <nav class="platforms" aria-label="Listen and follow">
      <a class="platform" href="https://open.spotify.com/intl-fr/artist/2ffUQ1p5izNf8yPQxYdfLX?si=M1DmNfjBQuqiKHv8y1CRhA" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.586 14.424a.622.622 0 0 1-.857.207c-2.348-1.435-5.304-1.76-8.785-.965a.622.622 0 1 1-.277-1.213c3.808-.87 7.076-.496 9.712 1.115.293.18.386.564.207.856zm1.223-2.723a.78.78 0 0 1-1.072.257c-2.688-1.652-6.786-2.13-9.965-1.166a.78.78 0 0 1-.452-1.492c3.63-1.102 8.147-.568 11.232 1.328a.78.78 0 0 1 .257 1.073zm.105-2.835C14.692 9.01 9.375 8.834 6.297 9.762a.936.936 0 1 1-.543-1.79c3.532-1.072 9.404-.865 13.115 1.338a.936.936 0 0 1-.955 1.556z"/></svg>
        <span class="p-text"><span class="p-name">Spotify</span><span class="p-handle">Stream the music</span></span>
      </a>

      <a class="platform" href="https://www.instagram.com/mihar.official/" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>
        <span class="p-text"><span class="p-name">Instagram</span><span class="p-handle">@mihar.official</span></span>
      </a>

      <a class="platform" href="https://www.tiktok.com/@mihar.official" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 2h-3v13.2a2.8 2.8 0 1 1-2.1-2.71V9.4a5.9 5.9 0 1 0 5.1 5.85V9.03a7.6 7.6 0 0 0 4.5 1.46V7.4a4.6 4.6 0 0 1-4.5-4.6z"/></svg>
        <span class="p-text"><span class="p-name">TikTok</span><span class="p-handle">@mihar.official</span></span>
      </a>

      <a class="platform" href="https://www.youtube.com/@Mihar.official?sub_confirmation=1" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2s-.21-1.5-.87-2.16c-.83-.87-1.76-.87-2.19-.92C15.4 4 12 4 12 4h-.01s-3.4 0-6.54.12c-.43.05-1.36.05-2.19.92C2.6 5.7 2.4 7.2 2.4 7.2S2.19 8.95 2.19 10.7v1.6c0 1.75.21 3.5.21 3.5s.21 1.5.87 2.16c.83.87 1.92.84 2.4.93 1.74.17 7.33.22 7.33.22s3.4 0 6.54-.12c.43-.05 1.36-.05 2.19-.92.66-.66.87-2.16.87-2.16s.21-1.75.21-3.5v-1.6c0-1.75-.21-3.5-.21-3.5zM9.98 14.6V8.9l5.4 2.86-5.4 2.84z"/></svg>
        <span class="p-text"><span class="p-name">YouTube</span><span class="p-handle">Subscribe</span></span>
      </a>
    </nav>
  </div>

  <div class="footer">MIHAR <span>&middot;</span> Agadir, Morocco</div>

</div>

<script>
  // MIHAR wordmark is the entry point to the next page.
  // For now there's nowhere to go — swap NEXT_PAGE_URL below once that page exists,
  // and this handler will navigate there instead of just flashing.
  const NEXT_PAGE_URL = null; // e.g. "world.html"

  const enterLink = document.getElementById('enterLink');
  const flash = document.getElementById('flash');

  enterLink.addEventListener('click', function(e){
    e.preventDefault();
    if (NEXT_PAGE_URL) {
      window.location.href = NEXT_PAGE_URL;
      return;
    }
    flash.classList.remove('hit');
    void flash.offsetWidth; // restart animation
    flash.classList.add('hit');
  });
</script>

</body>
</html>
